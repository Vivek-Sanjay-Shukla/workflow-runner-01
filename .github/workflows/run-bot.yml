name: Utility Task Runner

on:
  workflow_dispatch:

# Added to prevent multiple runs from executing simultaneously and killing your Telethon session
concurrency:
  group: scraper-bot-execution
  cancel-in-progress: true

jobs:
  execute-task:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Initialize Environment
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MODULE_SOURCE }}
          token: ${{ secrets.MODULE_KEY }}
          ref: "main"

      - name: Set up Runtime
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade --quiet pip
          pip install --quiet telethon google-genai python-dotenv duckduckgo_search requests beautifulsoup4 feedparser libsql_client certifi playwright python-dateutil cloudscraper pymysql cryptography aiohttp
          if [ -f requirements.txt ]; then
            pip install --quiet -r requirements.txt
          elif [ -f tech_jobs/requirements.txt ]; then
            pip install --quiet -r tech_jobs/requirements.txt
          fi

      - name: Install browser binaries
        run: |
          if [ ! -d "$HOME/.cache/ms-playwright" ]; then
            playwright install chromium --with-deps > /dev/null 2>&1
          fi

      - name: Execute Process
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "."
          APP_SYS_ENV: ${{ secrets.APP_SYS_ENV }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          trap 'rm -f .env execution.log' EXIT

          if [ -z "${APP_SYS_ENV:-}" ]; then
            exit 1
          fi

          python -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" <<'PY'
          import os
          import re
          import sys
          import subprocess

          secret = os.environ.get("APP_SYS_ENV", "")
          if not secret.strip():
              sys.exit(1)

          parsed = {}
          for raw in secret.replace("\r", "\n").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              line = re.sub(r"^export\s+", "", line)
              if "=" not in line:
                  continue
              key, val = line.split("=", 1)
              key = key.strip()
              val = val.strip()
              if len(val) >= 2 and (
                  (val[0] == '"' and val[-1] == '"')
                  or (val[0] == "'" and val[-1] == "'")
              ):
                  val = val[1:-1]
              if re.match(r"^[A-Za-z_][A-Za-z0-9_]*$", key):
                  parsed[key] = val

          if len(parsed) < 5:
              sys.exit(1)

          # Register masks for secrets so GitHub Actions redacts them across all logs
          for k, v in parsed.items():
              os.environ[k] = v
              if len(v) >= 4 and v.lower() not in {"true", "false", "none", "null", "main"}:
                  print(f"::add-mask::{v}", flush=True)

          # Ensure repository root is on PYTHONPATH for module imports
          cur_dir = os.path.abspath(".")
          os.environ["PYTHONPATH"] = cur_dir + os.pathsep + os.environ.get("PYTHONPATH", "")

          # Write temporary .env with strict permissions
          with open(".env", "w") as f:
              for k, v in parsed.items():
                  f.write(f"{k}={v}\n")
          try:
              os.chmod(".env", 0o600)
          except Exception:
              pass

          target = "tech_jobs/main.py"
          if not os.path.exists(target):
              sys.exit(1)

          log_path = "execution.log"
          status = 1
          try:
              with open(log_path, "w") as log_file:
                  proc = subprocess.run(
                      [sys.executable, target],
                      stdout=log_file,
                      stderr=subprocess.STDOUT,
                      env=os.environ,
                  )
                  status = proc.returncode
          except Exception:
              status = 1
          finally:
              if os.path.exists(".env"):
                  try:
                      os.remove(".env")
                  except Exception:
                      pass

          if status != 0:
              # Handle failure silently and route logs to Telegram ONLY
              bot_token = os.environ.get("BOT_TOKEN")
              storage_channel = os.environ.get("STORAGE_CHANNEL_ID")
              
              if bot_token and storage_channel and os.path.exists(log_path):
                  try:
                      import requests
                      with open(log_path, "rb") as f:
                          requests.post(
                              f"https://api.telegram.org/bot{bot_token}/sendDocument",
                              data={"chat_id": storage_channel, "caption": "🚨 Action Failure Log (Private Delivery)"},
                              files={"document": ("execution.log", f)},
                              timeout=25,
                          )
                  except Exception:
                      pass # Fails completely silently if network error occurs

              # Clean up log immediately
              if os.path.exists(log_path):
                  try:
                      os.remove(log_path)
                  except Exception:
                      pass

              sys.exit(1) # Action fails silently in GitHub console

          # Clean up log on success
          if os.path.exists(log_path):
              try:
                  os.remove(log_path)
              except Exception:
                  pass
          PY
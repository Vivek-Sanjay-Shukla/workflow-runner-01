name: Utility Task Runner

on:
  workflow_dispatch:

concurrency:
  group: scraper-bot-execution
  cancel-in-progress: true

jobs:
  execute-task:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Initialize Environment
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MODULE_SOURCE }}
          token: ${{ secrets.MODULE_KEY }}

      - name: Set up Runtime
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache Runtime Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', 'tech_jobs/main.py') }}

      - name: Install Requirements
        run: |
          python -m pip install --upgrade --quiet pip
          pip install --quiet telethon groq google-genai python-dotenv duckduckgo_search requests beautifulsoup4 feedparser libsql_client certifi playwright python-dateutil cloudscraper pymysql cryptography aiohttp
          if [ -f requirements.txt ]; then
            pip install --quiet -r requirements.txt
          elif [ -f tech_jobs/requirements.txt ]; then
            pip install --quiet -r tech_jobs/requirements.txt
          fi

      - name: Cache Browser Binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1

      - name: Install Browser Binaries
        run: |
          if [ ! -d "$HOME/.cache/ms-playwright" ]; then
            playwright install chromium --with-deps > /dev/null 2>&1
          fi

      - name: Execute Process
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "."
          APP_SYS_ENV: ${{ secrets.APP_SYS_ENV }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          trap 'rm -f .env tech_jobs/.env execution.log' EXIT

          if [ -z "${APP_SYS_ENV:-}" ]; then
            exit 1
          fi

          python -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" <<'PY'
          import os
          import re
          import sys
          import subprocess

          secret = os.environ.get("APP_SYS_ENV", "")
          if not secret.strip():
              sys.exit(1)

          parsed = {}
          for raw in secret.replace("\r", "\n").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              line = re.sub(r"^export\s+", "", line)
              if "=" not in line:
                  continue
              key, val = line.split("=", 1)
              key = key.strip()
              val = val.strip()
              if len(val) >= 2 and (
                  (val[0] == '"' and val[-1] == '"')
                  or (val[0] == "'" and val[-1] == "'")
              ):
                  val = val[1:-1]
              if re.match(r"^[A-Za-z_][A-Za-z0-9_]*$", key):
                  parsed[key] = val

          # Mask all secret values in GitHub Actions logs immediately
          for k, v in parsed.items():
              os.environ[k] = v
              if len(v) >= 4 and v.lower() not in {"true", "false", "none", "null", "main"}:
                  print(f"::add-mask::{v}", flush=True)

          # Remove any tracked .env files so os.environ takes strict priority (matching the private workflow)
          for env_file in [".env", os.path.join("tech_jobs", ".env")]:
              if os.path.exists(env_file):
                  try:
                      os.remove(env_file)
                  except Exception:
                      pass

          # Strictly require Turso & core credentials before starting so the bot never runs without deduplication
          required_keys = {
              "API_ID",
              "API_HASH",
              "SESSION_STRING",
              "BOT_TOKEN",
              "GEMINI_KEY",
              "MAIN_CHANNEL_ID",
              "TURSO_DATABASE_URL",
              "TURSO_WRITE_TOKEN",
          }
          missing_keys = [k for k in required_keys if not os.environ.get(k)]

          log_path = "execution.log"
          target = "tech_jobs/main.py"

          if missing_keys or not os.path.exists(target):
              with open(log_path, "w") as log_file:
                  if missing_keys:
                      log_file.write(f"Pre-flight check failed. Missing required keys in APP_SYS_ENV: {', '.join(missing_keys)}\n")
                  else:
                      log_file.write("Pre-flight check failed. Target script not found.\n")
              status = 1
          else:
              cur_dir = os.path.abspath(".")
              os.environ["PYTHONPATH"] = cur_dir + os.pathsep + os.environ.get("PYTHONPATH", "")
              status = 1
              try:
                  with open(log_path, "w") as log_file:
                      proc = subprocess.run(
                          [sys.executable, target],
                          stdout=log_file,
                          stderr=subprocess.STDOUT,
                          env=os.environ,
                      )
                      status = proc.returncode
              except Exception:
                  status = 1

          if status != 0:
              bot_token = os.environ.get("BOT_TOKEN")
              storage_channel = os.environ.get("STORAGE_CHANNEL_ID")

              if bot_token and storage_channel and os.path.exists(log_path):
                  try:
                      import requests
                      with open(log_path, "rb") as f:
                          requests.post(
                              f"https://api.telegram.org/bot{bot_token}/sendDocument",
                              data={"chat_id": storage_channel, "caption": "🚨 Action Failure Log (Private Delivery)"},
                              files={"document": ("execution.log", f)},
                              timeout=25,
                          )
                  except Exception:
                      pass

              if os.path.exists(log_path):
                  try:
                      os.remove(log_path)
                  except Exception:
                      pass

              sys.exit(1)

          if os.path.exists(log_path):
              try:
                  os.remove(log_path)
              except Exception:
                  pass
          PY